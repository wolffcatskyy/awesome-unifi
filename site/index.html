<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awesome UniFi - searchable directory</title>
  <meta name="description" content="Search and filter the Awesome UniFi list: UniFi tools, libraries, and resources with star counts, freshness, and UniFi OS compatibility.">
  <meta name="theme-color" content="#0a0a1a">
  <link rel="icon" type="image/jpeg" href="https://avatars.githubusercontent.com/u/153394885?v=4">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>Awesome <span class="accent">UniFi</span></h1>
      <p class="tagline">The curated list of UniFi tools, rendered as a searchable directory.
        Generated from <a href="https://github.com/wolffcatskyy/awesome-unifi">wolffcatskyy/awesome-unifi</a>.</p>
      <div class="stats" id="stats"></div>
    </header>

    <div class="controls" id="controls">
      <input type="search" id="q" placeholder="Search tools, descriptions, authors..." aria-label="Search">
      <div class="filters">
        <label>UniFi OS
          <select id="f-os">
            <option value="">Any</option>
            <option value="5">5.x</option>
            <option value="4">4.x</option>
            <option value="3">3.x</option>
            <option value="unknown">Unknown</option>
          </select>
        </label>
        <label>Runs
          <select id="f-deploy">
            <option value="">Anywhere</option>
            <option value="on-device">On-device</option>
            <option value="self-hosted">Self-hosted</option>
            <option value="library">Library / SDK</option>
            <option value="docs">Docs / guides</option>
            <option value="official">Official</option>
            <option value="unknown">Unknown</option>
          </select>
        </label>
        <label>Category
          <select id="f-cat"><option value="">All categories</option></select>
        </label>
        <label>Sort
          <select id="f-sort">
            <option value="stars">Most stars</option>
            <option value="updated">Recently updated</option>
            <option value="name">Name A-Z</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="f-archived"> Include archived</label>
      </div>
    </div>

    <main id="list" aria-live="polite"></main>

    <footer>
      <p>Data: <a href="https://github.com/wolffcatskyy/awesome-unifi/blob/main/data.json">data.json</a>,
        regenerated by CI from the README plus manual UniFi OS annotations.
        Compatibility values start as <em>unknown</em> and get filled in over time -
        <a href="https://github.com/wolffcatskyy/awesome-unifi/blob/main/data/overrides.json">contribute one</a>.</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
