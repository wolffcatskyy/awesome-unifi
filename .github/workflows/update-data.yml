name: Update data.json

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_data.py'
      - 'data/overrides.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate data.json
        run: python3 scripts/generate_data.py --readme README.md --out data.json --site-out site/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json site/data.json
          if git diff --cached --quiet; then
            echo "data.json already up to date"
          else
            git commit -m "chore: regenerate data.json"
            git push
          fi
